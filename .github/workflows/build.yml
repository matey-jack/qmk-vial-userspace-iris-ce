name: Build Vial firmware

on:
  push:
  workflow_dispatch:

# Default to read-only; the jobs below grant themselves what they need.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reuses QMK's own userspace build workflow, pointed at vial-qmk instead of
  # qmk_firmware. It checks out both repos, installs the CLI dependencies,
  # runs `qmk userspace-compile` over the targets in qmk.json, and uploads the
  # resulting binaries as a workflow artifact named "Firmware" -- on every
  # branch, which is what we want for non-main pushes.
  build:
    name: Build
    # qmk_userspace_build.yml declares `permissions: contents: write`. A called
    # workflow can never hold more than the calling job grants it, and anything
    # the caller omits is "none" -- so without this the whole run is rejected
    # before any job starts (conclusion: startup_failure).
    permissions:
      contents: write
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: vial-kb/vial-qmk
      qmk_ref: vial

  # Only pushes/merges to main turn into a release.
  release:
    name: Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          name: Firmware
          path: firmware

      # Releases are named after the build date. A second build on the same day
      # gets a ".2" suffix, a third ".3", and so on.
      - name: Pick release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(date -u +'%Y.%m.%d')"
          tag="$base"
          n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
             || gh release view "$tag" >/dev/null 2>&1; do
            n=$((n + 1))
            tag="$base.$n"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing as $tag"

      # Which extensions appear depends on the MCU of each build target: an
      # RP2040 board like the Iris CE produces a .uf2 and nothing else, so the
      # .hex/.bin globs below match nothing and `fail_on_unmatched_files` has
      # to stay false. That would also let a completely empty release through,
      # so assert here that the build actually produced something.
      - name: Check firmware was built
        run: |
          set -euo pipefail
          mapfile -t found < <(find firmware -type f \( -name '*.uf2' -o -name '*.hex' -o -name '*.bin' \))
          if [ "${#found[@]}" -eq 0 ]; then
            echo "::error::No firmware binaries in the build artifact; refusing to publish an empty release."
            exit 1
          fi
          printf 'Found %d firmware file(s):\n' "${#found[@]}"
          printf '  %s\n' "${found[@]}"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          body: |
            Vial firmware for `keebio/iris_ce/rev1`, built from
            ${{ github.repository }}@${{ github.sha }}
            against [vial-kb/vial-qmk@vial](https://github.com/vial-kb/vial-qmk/tree/vial).

            Flash the `.uf2` by putting the board into bootloader mode and
            copying the file onto the `RPI-RP2` drive that appears.
          files: |
            firmware/**/*.uf2
            firmware/**/*.hex
            firmware/**/*.bin
